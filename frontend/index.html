<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>StudyOrbit — Smart Study Schedule & Guide</title>
    <script>
      // Clean up any stale service workers from prior development on this port
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        }).catch(function() {});
      }
      // Diagnostic fallback in case of early browser bootstrap failure
      window.addEventListener('error', function(e) {
        console.error('StudyOrbit Boot Error:', e);
        var r = document.getElementById('root');
        if (r && (!r.children || r.children.length === 0)) {
          r.innerHTML = '<div style="padding: 40px 20px; font-family: sans-serif; text-align: center; max-width: 500px; margin: 60px auto; background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);"><h3 style="color: #ef4444; margin-bottom: 8px;">Failed to initialize</h3><p style="color: #64748b; font-size: 14px; margin-bottom: 16px;">' + (e.message || 'Script error') + '</p><button onclick="localStorage.clear(); location.reload();" style="padding: 10px 20px; border-radius: 8px; background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer;">Reset Storage & Reload</button></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
